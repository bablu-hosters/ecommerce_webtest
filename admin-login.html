
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff7ed;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #f97316;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ea580c;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #f97316;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🍔</div>

        <h2>Admin Login</h2>
        <p class="subtitle">Sign in to manage FoodExpress orders</p>

        <form id="adminLoginForm">

            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script>
        const loginForm = document.getElementById("adminLoginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");

       // Check whether admin is already logged in
async function checkAdminSession() {
    try {
        const response = await fetch(
            "http://127.0.0.1:3000/api/admin/session",
            {
                credentials: "include"
            }
        );

        if (response.ok) {
            window.location.replace("admin.html");
        }
    } catch (error) {
        console.error("Session check failed:", error);
    }
}

checkAdminSession();

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";
            loginMessage.textContent = "";

            try {
                const response = await fetch(
                    "http://127.0.0.1:3000/api/admin/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({ email, password })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed");
                }

                loginMessage.style.color = "green";
                loginMessage.textContent = "Login successful!";

                window.location.href = "admin.html";

            } catch (error) {
                loginMessage.style.color = "red";
                loginMessage.textContent =
                    error.message || "Unable to connect to server.";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
